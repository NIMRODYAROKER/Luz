name = "luz"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "DB"
class_name = "LuzDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LuzDB"]

# כל 10 דקות: בדיקה למי צריך לשלוח התראה
[triggers]
crons = ["*/10 * * * *"]
